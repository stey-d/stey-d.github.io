329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<title>Виступ і презентація, які запам'ятовуються<\u002Ftitle>\n<style>\nhtml { scroll-behavior: smooth; }\nbody { margin: 0; background: #FFFFFF; color: #1d2c5e; font-family: Roboto, sans-serif; -webkit-font-smoothing: antialiased; }\na { color: #243776; text-decoration: none; transition: opacity 200ms cubic-bezier(0.4,0,0.2,1); }\na:hover { color: #2d4594; opacity: .8; }\n* { box-sizing: border-box; }\n@keyframes fsk-drift { 0% { transform: translate(0,0); } 50% { transform: translate(-3%, 2%); } 100% { transform: translate(0,0); } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<nav style=\"position: fixed; top: 16px; left: 50%; z-index: 60; width: min(760px, calc(100% - 32px)); transform: translate(-50%, {{ navY }}); opacity: {{ navOpacity }}; pointer-events: {{ navPointer }}; transition: opacity 350ms cubic-bezier(0.4,0,0.2,1), transform 350ms cubic-bezier(0.4,0,0.2,1); background: rgba(255,255,255,0.82); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 50px; box-shadow: 0 8px 32px rgba(36,55,118,0.12); padding: 10px 10px 10px 24px; display: flex; align-items: center; gap: 16px;\">\n  <span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 14px; color: #1d2c5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0;\">{{ partLabel }}<\u002Fspan>\n  <div style=\"flex: 1 1 80px; height: 6px; border-radius: 50px; background: rgba(36,55,118,0.1); overflow: hidden;\"><div style=\"height: 100%; width: {{ progressPct }}; background: #243776; border-radius: 50px;\"><\u002Fdiv><\u002Fdiv>\n  <span style=\"padding: 8px 16px; border-radius: 50px; background: #243776; color: #FFFFFF; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 13px; white-space: nowrap;\">{{ discLabel }}<\u002Fspan>\n<\u002Fnav>\n\n<!-- HERO -->\n<header data-screen-label=\"01 Обкладинка\" style=\"position: relative; overflow: hidden; background: #1d2c5e; color: #FFFFFF; min-height: 92vh; display: flex; align-items: center; padding: 96px 24px;\">\n  <div style=\"position: absolute; inset: -20%; background-image: radial-gradient(rgba(255,255,255,0.07) 1.2px, transparent 1.2px); background-size: 28px 28px; animation: fsk-drift 24s cubic-bezier(0.4,0,0.2,1) infinite;\"><\u002Fdiv>\n  <div style=\"position: relative; max-width: 1120px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 48px;\">\n    <div data-r=\"0\" style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,0.72);\">Практичний посібник · 12 відкриттів · 12 хвилин<\u002Fdiv>\n    <h1 lang=\"uk\" style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 500; font-size: clamp(40px, 7.4vw, 104px); line-height: 1.02; letter-spacing: -0.02em; display: flex; flex-wrap: wrap; gap: 0 .26em; max-width: 1000px; hyphens: auto; overflow-wrap: break-word;\">\n      <span data-r=\"120\">Виступ<\u002Fspan><span data-r=\"200\">і<\u002Fspan><span data-r=\"280\">презентація,<\u002Fspan><span data-r=\"360\">які<\u002Fspan><span data-r=\"440\" style=\"color: rgba(255,255,255,0.55);\">запам'ятовуються<\u002Fspan>\n    <\u002Fh1>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 40px 64px; align-items: flex-end; justify-content: space-between;\">\n      <p data-r=\"560\" style=\"margin: 0; font-size: 20px; line-height: 1.6; color: rgba(255,255,255,0.86); max-width: 460px; text-wrap: pretty;\">Як побудувати промову, втримати увагу залу й зробити слайди, що допомагають, а не заважають.<\u002Fp>\n      <div data-r=\"700\" style=\"display: flex; gap: 40px; flex-wrap: wrap;\">\n        <div style=\"display: flex; flex-direction: column; gap: 6px; max-width: 180px;\">\n          <span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(56px, 7vw, 88px); font-weight: 500; line-height: 1; color: rgba(255,255,255,0.5);\"><span data-count=\"10\">10<\u002Fspan>%<\u002Fspan>\n          <span style=\"font-size: 15px; line-height: 1.5; color: rgba(255,255,255,0.8);\">почутого слухач пам'ятає через три дні<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 6px; max-width: 180px;\">\n          <span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(56px, 7vw, 88px); font-weight: 500; line-height: 1;\"><span data-count=\"65\">65<\u002Fspan>%<\u002Fspan>\n          <span style=\"font-size: 15px; line-height: 1.5; color: rgba(255,255,255,0.8);\">якщо почуте підкріпили зображенням<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-r=\"860\" style=\"display: flex; flex-wrap: wrap; gap: 12px;\">\n      <a href=\"#vystup\" style=\"padding: 14px 26px; border-radius: 50px; background: #FFFFFF; color: #1d2c5e; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 15px;\">Частина 1 · Виступ<\u002Fa>\n      <a href=\"#prezentatsiia\" style=\"padding: 14px 26px; border-radius: 50px; background: rgba(255,255,255,0.1); color: #FFFFFF; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 15px;\">Частина 2 · Презентація<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- INTRO -->\n<section data-screen-label=\"02 Вступ\" style=\"padding: clamp(80px, 11vw, 144px) 24px; background: linear-gradient(180deg, #FFFFFF 0%, #F4F6FA 100%);\">\n  <div style=\"max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px;\">\n    <p data-r=\"0\" style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(26px, 3.6vw, 40px); line-height: 1.3; color: #243776; letter-spacing: -0.01em; text-wrap: pretty;\">Згадайте останню конференцію, на якій ви були. Скільки слайдів залишилося в голові? Найімовірніше, жодного. Зате одна історія від спікера, мабуть, жива й досі.<\u002Fp>\n    <p data-r=\"100\" style=\"margin: 0; font-size: 19px; line-height: 1.6; max-width: 640px; text-wrap: pretty;\">Люди швидко забувають почуте, але довго пам'ятають пережите. Тож мета виступу не в тому, щоб передати максимум інформації. Вона в тому, щоб залишити слід.<\u002Fp>\n    <blockquote data-r=\"200\" style=\"margin: 0; padding: clamp(32px, 5vw, 56px); border-radius: 32px; background: #243776; color: #FFFFFF; font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(28px, 4.2vw, 48px); line-height: 1.18; font-weight: 500; letter-spacing: -0.01em; text-wrap: balance; box-shadow: 0 16px 48px rgba(36,55,118,0.14);\">Факти потрапляють до голови, а історії – до пам'яті.<\u002Fblockquote>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- PART 1 -->\n<section id=\"vystup\" data-part=\"Частина 1 · Виступ\" data-screen-label=\"03 Частина 1\" style=\"background: #243776; color: #FFFFFF; padding: clamp(96px, 12vw, 160px) 24px; overflow: hidden;\">\n  <div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px;\">\n    <div data-r=\"0\" style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,0.72);\">Частина перша · відкриття 01–06<\u002Fdiv>\n    <h2 data-r=\"100\" style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(72px, 15vw, 200px); font-weight: 500; line-height: .9; letter-spacing: -0.03em;\">Виступ<\u002Fh2>\n    <p data-r=\"200\" style=\"margin: 12px 0 0; font-size: 20px; line-height: 1.6; color: rgba(255,255,255,0.86); max-width: 520px;\">Що відбувається в голові слухача, поки ви говорите.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 01 -->\n<section data-disc=\"01\" data-screen-label=\"04 Одна думка\" style=\"padding: clamp(80px, 10vw, 128px) 24px;\">\n  <div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 40px 72px;\">\n    <div style=\"flex: 1 1 300px; align-self: flex-start; position: {{ stickyPos }}; top: 112px; display: flex; flex-direction: column; gap: 20px;\">\n      <div data-r=\"0\" style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(96px, 13vw, 168px); font-weight: 500; line-height: .85; color: rgba(36,55,118,0.12); letter-spacing: -0.04em;\">01<\u002Fdiv>\n      <h3 data-r=\"80\" style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(30px, 3.6vw, 44px); font-weight: 500; line-height: 1.12; letter-spacing: -0.01em; text-wrap: balance;\">Що більше ви скажете, то менше запам'ятають<\u002Fh3>\n    <\u002Fdiv>\n    <div style=\"flex: 2 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 32px;\">\n      <p data-r=\"0\" style=\"margin: 0; font-size: 19px; line-height: 1.6; text-wrap: pretty;\">Найчастіша помилка – хотіти сказати все. Здається, що чим більше вкласти в сорок хвилин, тим корисніше вийде. Насправді зал іде з туманом у голові й без жодного висновку.<\u002Fp>\n      <sc-if value=\"{{ showFacts }}\" hint-placeholder-val=\"{{ true }}\">\n        <div data-r=\"0\" style=\"padding: 40px; border-radius: 32px; background: #F4F6FA; display: flex; flex-direction: column; gap: 24px;\">\n          <div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #2d4594;\">Несподіваний факт<\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 24px;\">\n            <div style=\"display: flex; flex-direction: column; gap: 6px;\"><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 56px; font-weight: 500; line-height: 1; color: rgba(36,55,118,0.4);\"><span data-count=\"50\">50<\u002Fspan>%<\u002Fspan><span style=\"font-size: 15px; line-height: 1.5;\">очікували вгадати ті, хто вистукував мелодії<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 6px;\"><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 56px; font-weight: 500; line-height: 1; color: #243776;\"><span data-count=\"2.5\" data-dec=\"1\">2,5<\u002Fspan>%<\u002Fspan><span style=\"font-size: 15px; line-height: 1.5;\">вгадали насправді: 3 пісні зі 120<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.6; text-wrap: pretty;\">Той, хто знає тему, чує в голові мелодію. Зал чує лише стукіт.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <blockquote data-r=\"0\" style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(24px, 3vw, 32px); line-height: 1.3; font-weight: 500; color: #243776; text-wrap: balance;\">«Якщо слухач не може переказати вашу головну думку одним реченням, він її не почув.»<\u002Fblockquote>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px;\">\n        <div data-r=\"0\" style=\"padding: 28px; border-radius: 24px; background: #F4F6FA; display: flex; flex-direction: column; gap: 10px;\"><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: rgba(29,44,94,0.7);\">Звично<\u002Fspan><span style=\"font-size: 17px; line-height: 1.55;\">«Сьогодні поговоримо про загрози, паролі, MFA, резервні копії, оновлення та навчання персоналу».<\u002Fspan><\u002Fdiv>\n        <div data-r=\"120\" style=\"padding: 28px; border-radius: 24px; background: #243776; color: #FFFFFF; display: flex; flex-direction: column; gap: 10px;\"><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,0.72);\">Сильніше<\u002Fspan><span style=\"font-size: 17px; line-height: 1.55;\">«Одне налаштування на вашому телефоні закриває більшість атак на ваші акаунти».<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div data-r=\"0\" style=\"padding: 36px; border-radius: 32px; background: #1d2c5e; color: #FFFFFF; display: flex; flex-direction: column; gap: 20px;\">\n        <div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,0.72);\">Застосуйте сьогодні<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 32px 1fr; gap: 14px; align-items: start;\"><span style=\"width: 32px; height: 32px; border-radius: 50px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 14px;\">1<\u002Fspan><span style=\"font-size: 17px; line-height: 1.55;\">Сформулюйте головну думку так, ніби розповідаєте її колезі в ліфті. Одне речення, без дужок.<\u002Fspan><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 32px 1fr; gap: 14px; align-items: start;\"><span style=\"width: 32px; height: 32px; border-radius: 50px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 14px;\">2<\u002Fspan><span style=\"font-size: 17px; line-height: 1.55;\">Кожен блок виступу має відповідати на запитання: «Як це допомагає головній думці?» Якщо не допомагає – викреслюйте, хоч би яким цікавим він був.<\u002Fspan><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 32px 1fr; gap: 14px; align-items: start;\"><span style=\"width: 32px; height: 32px; border-radius: 50px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 14px;\">3<\u002Fspan><span style=\"font-size: 17px; line-height: 1.55;\">Три опорні тези – оптимум. П'ять уже важко утримати, десять неможливо.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 02 -->\n<section data-disc=\"02\" data-screen-label=\"05 Структура\" style=\"padding: clamp(80px, 10vw, 128px) 24px; background: #F4F6FA;\">\n  <div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 40px 72px;\">\n    <div style=\"flex: 1 1 300px; align-self: flex-start; position: {{ stickyPos }}; top: 112px; display: flex; flex-direction: column; gap: 20px;\">\n      <div data-r=\"0\" style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(96px, 13vw, 168px); font-weight: 500; line-height: .85; color: rgba(36,55,118,0.12); letter-spacing: -0.04em;\">02<\u002Fdiv>\n      <h3 data-r=\"80\" style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(30px, 3.6vw, 44px); font-weight: 500; line-height: 1.12; letter-spacing: -0.01em; text-wrap: balance;\">Головний герой виступу – не ви, а зал<\u002Fh3>\n    <\u002Fdiv>\n    <div style=\"flex: 2 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 32px;\">\n      <p data-r=\"0\" style=\"margin: 0; font-size: 19px; line-height: 1.6; text-wrap: pretty;\">Слухач не може перемотати вас назад. Тому структура має бути такою, щоб він ніколи не гублявся. Ваша роль – провідник: ви знаєте дорогу, а пройти її має людина в залі.<\u002Fp>\n      <div style=\"position: relative; display: flex; flex-direction: column; gap: 12px;\">\n        <div data-r=\"0\" style=\"padding: 24px 28px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 8px 32px rgba(36,55,118,0.06); display: grid; grid-template-columns: 56px 1fr; gap: 20px;\"><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 32px; font-weight: 500; line-height: 1; color: #243776;\">01<\u002Fspan><div style=\"display: flex; flex-direction: column; gap: 4px;\"><b style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 18px;\">Гачок (перші 30 секунд)<\u002Fb><span style=\"font-size: 16px; line-height: 1.55;\">Запитання, несподіваний факт, коротка сцена. Без подяк і слів «мене звати».<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div data-r=\"90\" style=\"padding: 24px 28px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 8px 32px rgba(36,55,118,0.06); display: grid; grid-template-columns: 56px 1fr; gap: 20px;\"><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 32px; font-weight: 500; line-height: 1; color: #243776;\">02<\u002Fspan><div style=\"display: flex; flex-direction: column; gap: 4px;\"><b style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 18px;\">Проблема<\u002Fb><span style=\"font-size: 16px; line-height: 1.55;\">Чому це взагалі важливо для людей у залі, а не для вас.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div data-r=\"180\" style=\"padding: 24px 28px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 8px 32px rgba(36,55,118,0.06); display: grid; grid-template-columns: 56px 1fr; gap: 20px;\"><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 32px; font-weight: 500; line-height: 1; color: #243776;\">03<\u002Fspan><div style=\"display: flex; flex-direction: column; gap: 4px;\"><b style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 18px;\">Рішення в трьох кроках<\u002Fb><span style=\"font-size: 16px; line-height: 1.55;\">Назвіть їх наперед, потім розгортайте по черзі.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div data-r=\"270\" style=\"padding: 24px 28px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 8px 32px rgba(36,55,118,0.06); display: grid; grid-template-columns: 56px 1fr; gap: 20px;\"><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 32px; font-weight: 500; line-height: 1; color: #243776;\">04<\u002Fspan><div style=\"display: flex; flex-direction: column; gap: 4px;\"><b style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 18px;\">Доказ<\u002Fb><span style=\"font-size: 16px; line-height: 1.55;\">Історія з практики, а потім одна переконлива цифра.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div data-r=\"360\" style=\"padding: 24px 28px; border-radius: 24px; background: #243776; color: #FFFFFF; display: grid; grid-template-columns: 56px 1fr; gap: 20px;\"><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 32px; font-weight: 500; line-height: 1;\">05<\u002Fspan><div style=\"display: flex; flex-direction: column; gap: 4px;\"><b style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 18px;\">Заклик<\u002Fb><span style=\"font-size: 16px; line-height: 1.55; color: rgba(255,255,255,0.9);\">Що конкретно слухач має зробити завтра зранку.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <blockquote data-r=\"0\" style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(24px, 3vw, 32px); line-height: 1.3; font-weight: 500; color: #243776; text-wrap: balance;\">«Починайте з того, що чіпляє, а завершуйте тим, що спонукає діяти.»<\u002Fblockquote>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 03 -->\n<section data-disc=\"03\" data-screen-label=\"06 Історія\" style=\"padding: clamp(80px, 10vw, 128px) 24px;\">\n  <div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 40px 72px;\">\n    <div style=\"flex: 1 1 300px; align-self: flex-start; position: {{ stickyPos }}; top: 112px; display: flex; flex-direction: column; gap: 20px;\">\n      <div data-r=\"0\" style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(96px, 13vw, 168px); font-weight: 500; line-height: .85; color: rgba(36,55,118,0.12); letter-spacing: -0.04em;\">03<\u002Fdiv>\n      <h3 data-r=\"80\" style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(30px, 3.6vw, 44px); font-weight: 500; line-height: 1.12; letter-spacing: -0.01em; text-wrap: balance;\">Одна історія переважує сотню цифр<\u002Fh3>\n    <\u002Fdiv>\n    <div style=\"flex: 2 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 32px;\">\n      <sc-if value=\"{{ showFacts }}\" hint-placeholder-val=\"{{ true }}\">\n        <div data-r=\"0\" style=\"padding: 40px; border-radius: 32px; background: #F4F6FA; display: flex; flex-direction: column; gap: 22px;\">\n          <div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #2d4594;\">Несподіваний факт<\u002Fdiv>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.6;\">Студенти виголошували короткі промови, а слухачі за кілька хвилин записували, що запам'ятали.<\u002Fp>\n          <div style=\"display: grid; grid-template-columns: 100px minmax(0, 1fr) 64px; gap: 16px; align-items: center;\">\n            <span style=\"font-size: 15px;\">Історії<\u002Fspan>\n            <div style=\"height: 22px; border-radius: 50px; background: rgba(36,55,118,0.08); overflow: hidden;\"><div data-bar=\"63%\" style=\"height: 100%; border-radius: 50px; background: #243776;\"><\u002Fdiv><\u002Fdiv>\n            <span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 600; color: #243776; text-align: right;\"><span data-count=\"63\">63<\u002Fspan>%<\u002Fspan>\n            <span style=\"font-size: 15px;\">Цифри<\u002Fspan>\n            <div style=\"height: 22px; border-radius: 50px; background: rgba(36,55,118,0.08); overflow: hidden;\"><div data-bar=\"5%\" style=\"height: 100%; border-radius: 50px; background: #2d4594;\"><\u002Fdiv><\u002Fdiv>\n            <span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 600; color: #243776; text-align: right;\"><span data-count=\"5\">5<\u002Fspan>%<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <p data-r=\"0\" style=\"margin: 0; font-size: 19px; line-height: 1.6; text-wrap: pretty;\">Цифри переконують розум, але рідко чіпають. Історія вмикає уяву, і слухач ніби сам проживає розказане. Цифру додайте потім, вона вже ляже на підготовлений ґрунт.<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px;\">\n        <div data-r=\"0\" style=\"padding: 28px; border-radius: 24px; background: #F4F6FA; display: flex; flex-direction: column; gap: 10px;\"><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: rgba(29,44,94,0.7);\">Замість<\u002Fspan><span style=\"font-size: 17px; line-height: 1.55;\">«91% інцидентів починаються з фішингу».<\u002Fspan><\u002Fdiv>\n        <div data-r=\"120\" style=\"padding: 28px; border-radius: 24px; background: #243776; color: #FFFFFF; display: flex; flex-direction: column; gap: 10px;\"><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,0.72);\">Спробуйте<\u002Fspan><span style=\"font-size: 17px; line-height: 1.55;\">«П'ятниця, вечір. Співробітник отримує лист від “бухгалтерії” і клікає. У понеділок офіс не може відкрити жодного файлу».<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n        <div data-r=\"0\" style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #2d4594;\">Каркас будь-якої історії<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px;\">\n          <div data-r=\"0\" style=\"padding: 24px; border-radius: 24px; background: rgba(36,55,118,0.08); display: flex; flex-direction: column; gap: 6px;\"><span style=\"font-size: 14px; color: #2d4594; font-weight: 500;\">1<\u002Fspan><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 500;\">Звичний світ<\u002Fspan><\u002Fdiv>\n          <div data-r=\"120\" style=\"padding: 24px; border-radius: 24px; background: rgba(36,55,118,0.2); display: flex; flex-direction: column; gap: 6px;\"><span style=\"font-size: 14px; color: #243776; font-weight: 500;\">2<\u002Fspan><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 500;\">Порушення рівноваги<\u002Fspan><\u002Fdiv>\n          <div data-r=\"240\" style=\"padding: 24px; border-radius: 24px; background: #243776; color: #FFFFFF; display: flex; flex-direction: column; gap: 6px;\"><span style=\"font-size: 14px; color: rgba(255,255,255,0.8); font-weight: 500;\">3<\u002Fspan><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 500;\">Вихід<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p data-r=\"0\" style=\"margin: 0; font-size: 17px; line-height: 1.6;\">Не треба вигадувати драми. Часто досить чесного випадку, де щось пішло не так.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 04 -->\n<section data-disc=\"04\" data-screen-label=\"07 Увага\" style=\"padding: clamp(80px, 10vw, 128px) 24px; background: #1d2c5e; color: #FFFFFF;\">\n  <div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px;\">\n    <div style=\"display: flex; flex-wrap: wrap; gap: 24px 72px; align-items: flex-end;\">\n      <div data-r=\"0\" style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(96px, 13vw, 168px); font-weight: 500; line-height: .85; color: rgba(255,255,255,0.12); letter-spacing: -0.04em;\">04<\u002Fdiv>\n      <h3 data-r=\"80\" style=\"margin: 0; flex: 1 1 400px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(30px, 4.2vw, 52px); font-weight: 500; line-height: 1.1; letter-spacing: -0.01em; text-wrap: balance;\">У вас є десять хвилин. Потім потрібен перезапуск<\u002Fh3>\n    <\u002Fdiv>\n    <div data-r=\"0\" style=\"padding: 36px 32px 24px; border-radius: 32px; background: rgba(255,255,255,0.05); display: flex; flex-direction: column; gap: 16px;\">\n      <div style=\"display: flex; align-items: flex-end; gap: 6px; height: 160px;\">\n        <sc-for list=\"{{ attentionBars }}\" as=\"bar\" hint-placeholder-count=\"30\">\n          <div data-grow=\"{{ bar.i }}\" style=\"flex: 1; height: {{ bar.h }}; border-radius: 50px; background: {{ bar.c }}; transform-origin: bottom;\"><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: rgba(255,255,255,0.72); flex-wrap: wrap;\"><span>0 хв<\u002Fspan><span>10 хв · зміна ритму<\u002Fspan><span>20 хв · зміна ритму<\u002Fspan><span>30 хв<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 40px 72px;\">\n      <p data-r=\"0\" style=\"margin: 0; flex: 1 1 300px; font-size: 19px; line-height: 1.6; color: rgba(255,255,255,0.9); text-wrap: pretty;\">Увага йде хвилями. Приблизно за десять хвилин монологу навіть зацікавлена людина починає думати про своє. Тому довгий виступ краще складати з коротких відрізків і на стиках міняти ритм.<\u002Fp>\n      <div style=\"flex: 2 1 440px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;\">\n        <div data-r=\"0\" style=\"padding: 22px 24px; border-radius: 24px; background: rgba(255,255,255,0.07); font-size: 16px; line-height: 1.55;\">Ставте запитання залу, навіть якщо відповідь – піднята рука.<\u002Fdiv>\n        <div data-r=\"80\" style=\"padding: 22px 24px; border-radius: 24px; background: rgba(255,255,255,0.07); font-size: 16px; line-height: 1.55;\">Чергуйте розповідь, приклад, демонстрацію, паузу.<\u002Fdiv>\n        <div data-r=\"160\" style=\"padding: 22px 24px; border-radius: 24px; background: rgba(255,255,255,0.07); font-size: 16px; line-height: 1.55;\">Міняйте темп і гучність. Рівний голос втомлює сильніше за швидкий.<\u002Fdiv>\n        <div data-r=\"240\" style=\"padding: 22px 24px; border-radius: 24px; background: rgba(255,255,255,0.07); font-size: 16px; line-height: 1.55;\">Говоріть «ви» і «ми», а не «користувачі» й «співробітники».<\u002Fdiv>\n        <div data-r=\"320\" style=\"padding: 22px 24px; border-radius: 24px; background: rgba(255,255,255,0.07); font-size: 16px; line-height: 1.55;\">Рухайтеся зі змістом: крок до залу на важливому, спокій на складному.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <blockquote data-r=\"0\" style=\"margin: 0; max-width: 820px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(26px, 3.4vw, 40px); line-height: 1.25; font-weight: 500; text-wrap: balance;\">«Тиша після сильної думки – це час, коли слухач її запам'ятовує.»<\u002Fblockquote>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 05 -->\n<section data-disc=\"05\" data-screen-label=\"08 Повторення\" style=\"padding: clamp(80px, 10vw, 128px) 24px;\">\n  <div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 40px 72px;\">\n    <div style=\"flex: 1 1 300px; align-self: flex-start; display: flex; flex-direction: column; gap: 20px;\">\n      <div data-r=\"0\" style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(96px, 13vw, 168px); font-weight: 500; line-height: .85; color: rgba(36,55,118,0.12); letter-spacing: -0.04em;\">05<\u002Fdiv>\n      <h3 data-r=\"80\" style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(30px, 3.6vw, 44px); font-weight: 500; line-height: 1.12; letter-spacing: -0.01em; text-wrap: balance;\">Повтор – не вада, а опора<\u002Fh3>\n    <\u002Fdiv>\n    <div style=\"flex: 2 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 32px;\">\n      <p data-r=\"0\" style=\"margin: 0; font-size: 19px; line-height: 1.6; text-wrap: pretty;\">Головна думка має прозвучати тричі, але щоразу інакше. Для слухача, який не може «перечитати», повтор – це опора.<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px;\">\n        <div data-r=\"0\" style=\"padding: 28px; border-radius: 24px; background: rgba(36,55,118,0.08); display: flex; flex-direction: column; gap: 8px;\"><span style=\"font-size: 14px; color: #2d4594;\">На початку<\u002Fspan><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 24px; font-weight: 500;\">як теза<\u002Fspan><\u002Fdiv>\n        <div data-r=\"150\" style=\"padding: 28px; border-radius: 24px; background: rgba(36,55,118,0.2); display: flex; flex-direction: column; gap: 8px;\"><span style=\"font-size: 14px; color: #243776;\">У середині<\u002Fspan><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 24px; font-weight: 500;\">як приклад<\u002Fspan><\u002Fdiv>\n        <div data-r=\"300\" style=\"padding: 28px; border-radius: 24px; background: #243776; color: #FFFFFF; display: flex; flex-direction: column; gap: 8px;\"><span style=\"font-size: 14px; color: rgba(255,255,255,0.8);\">Наприкінці<\u002Fspan><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 24px; font-weight: 500;\">як висновок<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 06 -->\n<section data-disc=\"06\" data-screen-label=\"09 Репетиція\" style=\"padding: clamp(80px, 10vw, 128px) 24px; background: #F4F6FA;\">\n  <div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 40px 72px;\">\n    <div style=\"flex: 1 1 300px; align-self: flex-start; position: {{ stickyPos }}; top: 112px; display: flex; flex-direction: column; gap: 20px;\">\n      <div data-r=\"0\" style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(96px, 13vw, 168px); font-weight: 500; line-height: .85; color: rgba(36,55,118,0.12); letter-spacing: -0.04em;\">06<\u002Fdiv>\n      <h3 data-r=\"80\" style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(30px, 3.6vw, 44px); font-weight: 500; line-height: 1.12; letter-spacing: -0.01em; text-wrap: balance;\">Читати слайди пошепки – ще не репетиція<\u002Fh3>\n    <\u002Fdiv>\n    <div style=\"flex: 2 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 32px;\">\n      <p data-r=\"0\" style=\"margin: 0; font-size: 19px; line-height: 1.6; text-wrap: pretty;\">Промовте виступ уголос, на ногах, із таймером. Краще перед однією-двома живими людьми. Саме тоді видно, де ви збиваєтеся, де затягуєте, де фраза гарна на папері й незграбна вголос.<\u002Fp>\n      <p data-r=\"0\" style=\"margin: 0; font-size: 19px; line-height: 1.6; text-wrap: pretty;\">Після двох-трьох прогонів з'являється спокій, а разом із ним і право на імпровізацію.<\u002Fp>\n      <sc-if value=\"{{ showFacts }}\" hint-placeholder-val=\"{{ true }}\">\n        <div data-r=\"0\" style=\"padding: 40px; border-radius: 32px; background: #FFFFFF; box-shadow: 0 8px 32px rgba(36,55,118,0.08); display: flex; flex-direction: column; gap: 20px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 16px;\"><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #2d4594;\">Правило 80%<\u002Fspan><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 40px; font-weight: 500; line-height: 1; color: #243776;\"><span data-count=\"80\">80<\u002Fspan>%<\u002Fspan><\u002Fdiv>\n          <div style=\"height: 22px; border-radius: 50px; background: rgba(36,55,118,0.08); overflow: hidden;\"><div data-bar=\"80%\" style=\"height: 100%; border-radius: 50px; background: #243776;\"><\u002Fdiv><\u002Fdiv>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.6; text-wrap: pretty;\">У Японії є звичка вставати з-за столу ситим на вісім десятих. Із виступом так само: завершіть трохи раніше, ніж вичерпали час, і зал захоче продовження, а не перерви.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div data-r=\"0\" style=\"padding: 36px; border-radius: 32px; background: #1d2c5e; color: #FFFFFF; display: flex; flex-direction: column; gap: 20px;\">\n        <div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,0.72);\">Застосуйте сьогодні<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 32px 1fr; gap: 14px; align-items: start;\"><span style=\"width: 32px; height: 32px; border-radius: 50px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 14px;\">1<\u002Fspan><span style=\"font-size: 17px; line-height: 1.55;\">Завчіть початок і кінець майже дослівно, середину тримайте на опорних словах.<\u002Fspan><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 32px 1fr; gap: 14px; align-items: start;\"><span style=\"width: 32px; height: 32px; border-radius: 50px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 14px;\">2<\u002Fspan><span style=\"font-size: 17px; line-height: 1.55;\">Залиште в запасі п'ять хвилин. Виступи майже завжди йдуть довше, ніж у репетиції.<\u002Fspan><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 32px 1fr; gap: 14px; align-items: start;\"><span style=\"width: 32px; height: 32px; border-radius: 50px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 14px;\">3<\u002Fspan><span style=\"font-size: 17px; line-height: 1.55;\">Перевірте обладнання за годину до початку, а не за п'ять хвилин.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- PART 2 -->\n<section id=\"prezentatsiia\" data-part=\"Частина 2 · Презентація\" data-screen-label=\"10 Частина 2\" style=\"background: #243776; color: #FFFFFF; padding: clamp(96px, 12vw, 160px) 24px; overflow: hidden;\">\n  <div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px;\">\n    <div data-r=\"0\" style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,0.72);\">Частина друга · відкриття 07–12<\u002Fdiv>\n    <h2 data-r=\"100\" lang=\"uk\" style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(56px, 12vw, 168px); font-weight: 500; line-height: .9; letter-spacing: -0.03em; hyphens: auto; overflow-wrap: break-word;\">Презентація<\u002Fh2>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 32px 72px; margin-top: 16px;\">\n      <p data-r=\"200\" style=\"margin: 0; flex: 1 1 320px; font-size: 19px; line-height: 1.6; color: rgba(255,255,255,0.9); text-wrap: pretty;\">Слайд існує, щоб допомогти слухачеві зрозуміти, а не щоб підказувати промовцю. Якщо слайд дублює ваші слова, слухач читає, а не слухає, і ви відходите на другий план у власному виступі.<\u002Fp>\n      <blockquote data-r=\"300\" style=\"margin: 0; flex: 1 1 320px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(24px, 3vw, 32px); line-height: 1.28; font-weight: 500;\">«Слайд – це не конспект виступу, а ілюстрація до нього.»<\u002Fblockquote>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 07 -->\n<section data-disc=\"07\" data-screen-label=\"11 Структура слайдів\" style=\"padding: clamp(80px, 10vw, 128px) 24px;\">\n  <div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 40px 72px;\">\n    <div style=\"flex: 1 1 300px; align-self: flex-start; position: {{ stickyPos }}; top: 112px; display: flex; flex-direction: column; gap: 20px;\">\n      <div data-r=\"0\" style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(96px, 13vw, 168px); font-weight: 500; line-height: .85; color: rgba(36,55,118,0.12); letter-spacing: -0.04em;\">07<\u002Fdiv>\n      <div data-r=\"40\" style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #2d4594;\">Структура слайдів<\u002Fdiv>\n      <h3 data-r=\"80\" style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(30px, 3.6vw, 44px); font-weight: 500; line-height: 1.12; letter-spacing: -0.01em; text-wrap: balance;\">Багато слайдів – нормально. Багато тексту на слайді – ні<\u002Fh3>\n    <\u002Fdiv>\n    <div style=\"flex: 2 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 32px;\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px;\">\n        <div data-r=\"0\" style=\"padding: 28px; border-radius: 24px; background: #F4F6FA; display: flex; flex-direction: column; gap: 10px;\"><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: rgba(29,44,94,0.7);\">Заголовок-тема<\u002Fspan><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 500; color: rgba(29,44,94,0.75);\">Результати дослідження<\u002Fspan><\u002Fdiv>\n        <div data-r=\"120\" style=\"padding: 28px; border-radius: 24px; background: #243776; color: #FFFFFF; display: flex; flex-direction: column; gap: 10px;\"><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,0.72);\">Заголовок-висновок<\u002Fspan><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 500;\">Кожен третій лист – шкідливий<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 24px;\">\n        <div data-r=\"0\" style=\"display: flex; flex-direction: column; gap: 4px;\"><b style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 19px;\">Одна ідея на слайд<\u002Fb><span style=\"font-size: 17px; line-height: 1.6;\">Нова думка – новий слайд. Слайдів може бути багато, і це нормально, якщо кожен змінюється за кілька секунд.<\u002Fspan><\u002Fdiv>\n        <div data-r=\"0\" style=\"display: flex; flex-direction: column; gap: 4px;\"><b style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 19px;\">Заголовок уже містить думку<\u002Fb><span style=\"font-size: 17px; line-height: 1.6;\">Слухач, який лише глянув на екран, має зрозуміти висновок.<\u002Fspan><\u002Fdiv>\n        <div data-r=\"0\" style=\"display: flex; flex-direction: column; gap: 4px;\"><b style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 19px;\">Логіка в трьох частинах<\u002Fb><span style=\"font-size: 17px; line-height: 1.6;\">Вступний слайд із темою й гачком, основні слайди за вашими трьома тезами, фінальний слайд із закликом до дії.<\u002Fspan><\u002Fdiv>\n        <div data-r=\"0\" style=\"display: flex; flex-direction: column; gap: 4px;\"><b style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 19px;\">Один слайд на одну–дві хвилини<\u002Fb><span style=\"font-size: 17px; line-height: 1.6;\">Більше – зал втомиться, менше – ви не встигнете пояснити.<\u002Fspan><\u002Fdiv>\n        <div data-r=\"0\" style=\"display: flex; flex-direction: column; gap: 4px;\"><b style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 19px;\">Не завершуйте слайдом «Дякую за увагу»<\u002Fb><span style=\"font-size: 17px; line-height: 1.6;\">Залиште на екрані головну думку або контакт, нехай вона висить, поки йдуть запитання.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 08 SLIDE MORPH -->\n<section data-disc=\"08\" data-screen-label=\"12 Текст\" style=\"padding: clamp(80px, 10vw, 128px) 24px; background: #F4F6FA;\">\n  <div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 40px 72px; align-items: center;\">\n    <div style=\"flex: 1 1 300px; display: flex; flex-direction: column; gap: 20px;\">\n      <div data-r=\"0\" style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(96px, 13vw, 168px); font-weight: 500; line-height: .85; color: rgba(36,55,118,0.12); letter-spacing: -0.04em;\">08<\u002Fdiv>\n      <div data-r=\"40\" style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #2d4594;\">Текст<\u002Fdiv>\n      <h3 data-r=\"80\" style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(30px, 3.6vw, 44px); font-weight: 500; line-height: 1.12; letter-spacing: -0.01em; text-wrap: balance;\">Три секунди – стільки часу має слайд<\u002Fh3>\n      <p data-r=\"120\" style=\"margin: 0; font-size: 18px; line-height: 1.6; text-wrap: pretty;\">Слухач не вміє одночасно читати й слухати. Тому тексту має бути так мало, щоб його прочитали за три секунди.<\u002Fp>\n      <div data-r=\"160\" style=\"display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.55;\">\n        <span>Не більше шести–семи слів у заголовку й однієї короткої фрази під ним.<\u002Fspan>\n        <span>Якщо потрібен список, то до трьох пунктів. П'ять рядків уже абзац.<\u002Fspan>\n        <span>Пишіть фразами, а не реченнями з крапкою. Скорочуйте безжально.<\u002Fspan>\n        <span>Деталі, таблиці й довідкові дані винесіть у роздатковий матеріал.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-r=\"0\" style=\"flex: 1.3 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 16px;\">\n      <div style=\"display: flex; gap: 6px; padding: 6px; border-radius: 50px; background: #FFFFFF; align-self: flex-start; box-shadow: 0 8px 32px rgba(36,55,118,0.08);\">\n        <button sc-camel-on-click=\"{{ showBad }}\" style=\"border: none; cursor: pointer; padding: 10px 22px; border-radius: 50px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 14px; background: {{ badBtnBg }}; color: {{ badBtnFg }}; transition: background 200ms cubic-bezier(0.4,0,0.2,1), color 200ms cubic-bezier(0.4,0,0.2,1);\">Не так<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ showGood }}\" style=\"border: none; cursor: pointer; padding: 10px 22px; border-radius: 50px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 14px; background: {{ goodBtnBg }}; color: {{ goodBtnFg }}; transition: background 200ms cubic-bezier(0.4,0,0.2,1), color 200ms cubic-bezier(0.4,0,0.2,1);\">Так<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"position: relative; aspect-ratio: 16 / 9; border-radius: 24px; overflow: hidden; box-shadow: 0 16px 48px rgba(36,55,118,0.14);\">\n        <div style=\"position: absolute; inset: 0; background: #FFFFFF; padding: 6% 6.5%; display: flex; flex-direction: column; gap: 3%; opacity: {{ badOpacity }}; transform: scale({{ badScale }}); transition: opacity 500ms cubic-bezier(0.4,0,0.2,1), transform 500ms cubic-bezier(0.4,0,0.2,1);\">\n          <b style=\"font-size: clamp(11px, 1.4vw, 15px); color: #1d2c5e;\">Результати аналізу ризиків інформаційної безпеки за 2026 рік<\u002Fb>\n          <span style=\"font-size: clamp(9px, 1.1vw, 12px); line-height: 1.4; color: rgba(29,44,94,0.75);\">• У ході дослідження було встановлено, що значна частина інцидентів пов'язана з людським фактором<\u002Fspan>\n          <span style=\"font-size: clamp(9px, 1.1vw, 12px); line-height: 1.4; color: rgba(29,44,94,0.75);\">• Також слід зазначити, що впровадження багатофакторної автентифікації дозволяє суттєво знизити ймовірність компрометації облікових записів<\u002Fspan>\n          <span style=\"font-size: clamp(9px, 1.1vw, 12px); line-height: 1.4; color: rgba(29,44,94,0.75);\">• Крім того, рекомендується проводити регулярне навчання співробітників…<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"position: absolute; inset: 0; background: #243776; color: #FFFFFF; padding: 6% 8%; display: flex; flex-direction: column; justify-content: center; gap: 8px; opacity: {{ goodOpacity }}; transform: scale({{ goodScale }}); transition: opacity 500ms cubic-bezier(0.4,0,0.2,1), transform 500ms cubic-bezier(0.4,0,0.2,1);\">\n          <div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(56px, 9vw, 112px); font-weight: 500; line-height: 1;\">91%<\u002Fdiv>\n          <div style=\"font-size: clamp(16px, 1.8vw, 22px); color: rgba(255,255,255,0.9);\">атак починаються з одного листа<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size: 15px; line-height: 1.5;\">{{ slideCaption }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 09 -->\n<section data-disc=\"09\" data-screen-label=\"13 Візуальні елементи\" style=\"padding: clamp(80px, 10vw, 128px) 24px;\">\n  <div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px;\">\n    <div style=\"display: flex; flex-wrap: wrap; gap: 24px 72px; align-items: flex-end;\">\n      <div data-r=\"0\" style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(96px, 13vw, 168px); font-weight: 500; line-height: .85; color: rgba(36,55,118,0.12); letter-spacing: -0.04em;\">09<\u002Fdiv>\n      <div style=\"flex: 1 1 400px; display: flex; flex-direction: column; gap: 16px;\">\n        <div data-r=\"40\" style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #2d4594;\">Візуальні елементи<\u002Fdiv>\n        <h3 data-r=\"80\" style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(30px, 4.2vw, 52px); font-weight: 500; line-height: 1.1; letter-spacing: -0.01em; text-wrap: balance;\">Порожнє місце на слайді теж говорить<\u002Fh3>\n        <p data-r=\"120\" style=\"margin: 0; font-size: 18px; line-height: 1.6; max-width: 620px;\">Зображення запам'ятовується вшестеро краще за слово. Але лише тоді, коли воно одне й працює на думку.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px;\">\n      <div data-r=\"0\" style-hover=\"box-shadow: 0 16px 48px rgba(36,55,118,0.14); transform: translateY(-4px);\" style=\"padding: 32px; border-radius: 24px; background: #F4F6FA; display: flex; flex-direction: column; gap: 8px; transition: box-shadow 350ms cubic-bezier(0.4,0,0.2,1), transform 350ms cubic-bezier(0.4,0,0.2,1);\"><b style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 18px; color: #243776;\">Фото замість кліше<\u002Fb><span style=\"font-size: 16px; line-height: 1.55;\">Живе зображення працює сильніше за стоковий «діловий потиск рук». Один образ на весь слайд краще за десять маленьких.<\u002Fspan><\u002Fdiv>\n      <div data-r=\"80\" style-hover=\"box-shadow: 0 16px 48px rgba(36,55,118,0.14); transform: translateY(-4px);\" style=\"padding: 32px; border-radius: 24px; background: #F4F6FA; display: flex; flex-direction: column; gap: 8px; transition: box-shadow 350ms cubic-bezier(0.4,0,0.2,1), transform 350ms cubic-bezier(0.4,0,0.2,1);\"><b style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 18px; color: #243776;\">Діаграма з однією історією<\u002Fb><span style=\"font-size: 16px; line-height: 1.55;\">Прибирайте зайві лінії, сітку, легенди. Підсвічуйте те, на що дивитися, решту робіть сірим.<\u002Fspan><\u002Fdiv>\n      <div data-r=\"160\" style-hover=\"box-shadow: 0 16px 48px rgba(36,55,118,0.14); transform: translateY(-4px);\" style=\"padding: 32px; border-radius: 24px; background: #F4F6FA; display: flex; flex-direction: column; gap: 8px; transition: box-shadow 350ms cubic-bezier(0.4,0,0.2,1), transform 350ms cubic-bezier(0.4,0,0.2,1);\"><b style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 18px; color: #243776;\">Іконки в одному стилі<\u002Fb><span style=\"font-size: 16px; line-height: 1.55;\">Змішування стилів одразу видає неохайність.<\u002Fspan><\u002Fdiv>\n      <div data-r=\"0\" style-hover=\"box-shadow: 0 16px 48px rgba(36,55,118,0.14); transform: translateY(-4px);\" style=\"padding: 32px; border-radius: 24px; background: #F4F6FA; display: flex; flex-direction: column; gap: 8px; transition: box-shadow 350ms cubic-bezier(0.4,0,0.2,1), transform 350ms cubic-bezier(0.4,0,0.2,1);\"><b style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 18px; color: #243776;\">Схеми зліва направо<\u002Fb><span style=\"font-size: 16px; line-height: 1.55;\">Процеси малюйте в напрямку читання, не більше п'яти блоків.<\u002Fspan><\u002Fdiv>\n      <div data-r=\"80\" style-hover=\"box-shadow: 0 16px 48px rgba(36,55,118,0.14); transform: translateY(-4px);\" style=\"padding: 32px; border-radius: 24px; background: #F4F6FA; display: flex; flex-direction: column; gap: 8px; transition: box-shadow 350ms cubic-bezier(0.4,0,0.2,1), transform 350ms cubic-bezier(0.4,0,0.2,1);\"><b style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 18px; color: #243776;\">Анімація тільки за потреби<\u002Fb><span style=\"font-size: 16px; line-height: 1.55;\">Поява пунктів по одному допомагає, літаючі заголовки дратують.<\u002Fspan><\u002Fdiv>\n      <div data-r=\"160\" style=\"padding: 32px; border-radius: 24px; background: #243776; color: #FFFFFF; display: flex; flex-direction: column; gap: 8px;\"><b style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 18px;\">Повітря – це теж елемент<\u002Fb><span style=\"font-size: 16px; line-height: 1.55; color: rgba(255,255,255,0.9);\">Порожнє місце на слайді не хиба, а спосіб показати, що важливо.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 10 + 11 -->\n<section data-disc=\"10\" data-screen-label=\"14 Кольори і шрифти\" style=\"padding: clamp(80px, 10vw, 128px) 24px; background: #F4F6FA;\">\n  <div style=\"max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 24px;\">\n    <div data-r=\"0\" style=\"padding: clamp(28px, 4vw, 48px); border-radius: 32px; background: #FFFFFF; display: flex; flex-direction: column; gap: 24px;\">\n      <div style=\"display: flex; align-items: baseline; gap: 16px;\"><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 64px; font-weight: 500; line-height: .85; color: rgba(36,55,118,0.12);\">10<\u002Fspan><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #2d4594;\">Кольори<\u002Fspan><\u002Fdiv>\n      <h3 style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(28px, 3.2vw, 36px); font-weight: 500; line-height: 1.15;\">Три кольори, не більше<\u002Fh3>\n      <p style=\"margin: 0; font-size: 17px; line-height: 1.6;\">Одна основна барва, один акцент і нейтральний фон. Достатній контраст важливіший за красу: сидячи в задніх рядах, слухач має бачити кожне слово.<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\"><div data-grow=\"0\" style=\"height: 72px; border-radius: 16px; background: #243776; transform-origin: bottom;\"><\u002Fdiv><b style=\"font-size: 13px;\">Основний<\u002Fb><span style=\"font-size: 12px; line-height: 1.4; color: rgba(29,44,94,0.75);\">заголовки, акцентні слайди<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\"><div data-grow=\"3\" style=\"height: 72px; border-radius: 16px; background: #2d4594; transform-origin: bottom;\"><\u002Fdiv><b style=\"font-size: 13px;\">Акцент<\u002Fb><span style=\"font-size: 12px; line-height: 1.4; color: rgba(29,44,94,0.75);\">одна цифра чи слово<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\"><div data-grow=\"6\" style=\"height: 72px; border-radius: 16px; background: #F4F6FA; transform-origin: bottom;\"><\u002Fdiv><b style=\"font-size: 13px;\">Фон<\u002Fb><span style=\"font-size: 12px; line-height: 1.4; color: rgba(29,44,94,0.75);\">світлий, стриманий<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\"><div data-grow=\"9\" style=\"height: 72px; border-radius: 16px; background: #1d2c5e; transform-origin: bottom;\"><\u002Fdiv><b style=\"font-size: 13px;\">Текст<\u002Fb><span style=\"font-size: 12px; line-height: 1.4; color: rgba(29,44,94,0.75);\">глибокий синій замість чорного<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 12px; font-size: 16px; line-height: 1.55;\">\n        <span>Темний текст на світлому фоні або білий на насиченому. Світло-сірий на білому нечитабельний із залу.<\u002Fspan>\n        <span>Акцентний колір – для одного елемента на слайді, інакше він перестає бути акцентом.<\u002Fspan>\n        <span>У діаграмах не покладайтеся лише на колір: частина людей розрізняє відтінки гірше, тож додавайте підписи.<\u002Fspan>\n        <span>Дотримуйтесь корпоративної палітри, якщо вона є, і уникайте важких чорних фонів у документах, які люди читатимуть.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-r=\"120\" data-disc=\"11\" style=\"padding: clamp(28px, 4vw, 48px); border-radius: 32px; background: #FFFFFF; display: flex; flex-direction: column; gap: 24px;\">\n      <div style=\"display: flex; align-items: baseline; gap: 16px;\"><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 64px; font-weight: 500; line-height: .85; color: rgba(36,55,118,0.12);\">11<\u002Fspan><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #2d4594;\">Шрифти<\u002Fspan><\u002Fdiv>\n      <h3 style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(28px, 3.2vw, 36px); font-weight: 500; line-height: 1.15;\">Якщо зменшуєте шрифт – скорочуйте текст<\u002Fh3>\n      <div style=\"display: flex; flex-direction: column; gap: 10px; padding: 24px; border-radius: 24px; background: #F4F6FA;\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px;\"><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 32px; font-weight: 500; line-height: 1.1;\">Заголовок<\u002Fspan><span style=\"font-size: 13px; color: #2d4594; white-space: nowrap;\">від 32 pt<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px;\"><span style=\"font-size: 24px; line-height: 1.2;\">Основний текст<\u002Fspan><span style=\"font-size: 13px; color: #2d4594; white-space: nowrap;\">від 24 pt<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px;\"><span style=\"font-size: 18px; line-height: 1.2;\">Підпис до діаграми<\u002Fspan><span style=\"font-size: 13px; color: #2d4594; white-space: nowrap;\">від 18 pt<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 12px; font-size: 16px; line-height: 1.55;\">\n        <span><b>Не більше двох гарнітур:<\u002Fb> одна для заголовків, друга для основного тексту. Або одна, але в різних накресленнях.<\u002Fspan>\n        <span><b>Без засічок<\u002Fb> (Arial, Calibri, Inter, Segoe UI) краще читаються з екрана на відстані.<\u002Fspan>\n        <span>Не вживайте суцільні великі літери для речень, а курсив і підкреслення залиште для рідкісних акцентів.<\u002Fspan>\n        <span>Вирівнюйте по лівому краю. Центрований довгий текст важко читати.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 12 -->\n<section data-disc=\"12\" data-screen-label=\"15 Шаблони\" style=\"padding: clamp(80px, 10vw, 128px) 24px;\">\n  <div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px;\">\n    <div style=\"display: flex; flex-wrap: wrap; gap: 24px 72px; align-items: flex-end;\">\n      <div data-r=\"0\" style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(96px, 13vw, 168px); font-weight: 500; line-height: .85; color: rgba(36,55,118,0.12); letter-spacing: -0.04em;\">12<\u002Fdiv>\n      <div style=\"flex: 1 1 400px; display: flex; flex-direction: column; gap: 16px;\">\n        <div data-r=\"40\" style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #2d4594;\">Шаблони<\u002Fdiv>\n        <h3 data-r=\"80\" style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(30px, 4.2vw, 52px); font-weight: 500; line-height: 1.1; letter-spacing: -0.01em; text-wrap: balance;\">Три слайди, які можна взяти за основу вже сьогодні<\u002Fh3>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px;\">\n      <div data-r=\"0\" style=\"display: flex; flex-direction: column; gap: 16px;\">\n        <div style-hover=\"transform: translateY(-4px); box-shadow: 0 16px 48px rgba(36,55,118,0.14);\" style=\"aspect-ratio: 16 / 9; border-radius: 24px; background: #F4F6FA; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transition: transform 350ms cubic-bezier(0.4,0,0.2,1), box-shadow 350ms cubic-bezier(0.4,0,0.2,1);\">\n          <span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 56px; font-weight: 500; line-height: 1; color: #243776;\">×3<\u002Fspan>\n          <span style=\"font-size: 14px;\">менше інцидентів<\u002Fspan>\n        <\u002Fdiv>\n        <b style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 19px;\">Слайд-цифра<\u002Fb>\n        <span style=\"font-size: 16px; line-height: 1.55;\">Одна велика цифра по центру й підпис з пояснення. Працює для доказів і контрасту: «було – стало».<\u002Fspan>\n      <\u002Fdiv>\n      <div data-r=\"120\" style=\"display: flex; flex-direction: column; gap: 16px;\">\n        <div style-hover=\"transform: translateY(-4px); box-shadow: 0 16px 48px rgba(36,55,118,0.14);\" style=\"aspect-ratio: 16 / 9; border-radius: 24px; background: linear-gradient(160deg, #2d4594 0%, #1d2c5e 100%); display: flex; align-items: flex-end; padding: 20px 24px; transition: transform 350ms cubic-bezier(0.4,0,0.2,1), box-shadow 350ms cubic-bezier(0.4,0,0.2,1);\">\n          <span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 500; color: #FFFFFF; line-height: 1.2;\">П'ятниця, 18:40.<br>Один клік.<\u002Fspan>\n        <\u002Fdiv>\n        <b style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 19px;\">Слайд-образ<\u002Fb>\n        <span style=\"font-size: 16px; line-height: 1.55;\">Фото на весь екран і п'ять слів поверх. Добре для історій, сцен із життя та емоційних точок виступу.<\u002Fspan>\n      <\u002Fdiv>\n      <div data-r=\"240\" style=\"display: flex; flex-direction: column; gap: 16px;\">\n        <div style-hover=\"transform: translateY(-4px); box-shadow: 0 16px 48px rgba(36,55,118,0.14);\" style=\"aspect-ratio: 16 / 9; border-radius: 24px; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; transition: transform 350ms cubic-bezier(0.4,0,0.2,1), box-shadow 350ms cubic-bezier(0.4,0,0.2,1);\">\n          <div style=\"background: #F4F6FA; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 16px 20px;\"><span style=\"font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: rgba(29,44,94,0.7);\">Міф<\u002Fspan><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 17px; font-weight: 500; line-height: 1.25;\">Нас ніхто не атакує<\u002Fspan><\u002Fdiv>\n          <div style=\"background: #243776; color: #FFFFFF; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 16px 20px;\"><span style=\"font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,0.72);\">Реальність<\u002Fspan><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 17px; font-weight: 500; line-height: 1.25;\">Атакують усіх<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <b style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 19px;\">Слайд-порівняння<\u002Fb>\n        <span style=\"font-size: 16px; line-height: 1.55;\">Два стовпчики «було» й «стало» або «міф» і «реальність». Мінімум слів, максимум контрасту.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CHECKLIST -->\n<section data-screen-label=\"16 Чекліст\" style=\"padding: clamp(80px, 10vw, 128px) 24px; background: #1d2c5e; color: #FFFFFF;\">\n  <div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 48px 72px;\">\n    <div style=\"flex: 1 1 300px; align-self: flex-start; position: {{ stickyPos }}; top: 112px; display: flex; flex-direction: column; gap: 24px;\">\n      <div data-r=\"0\" style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,0.72);\">Перевірка перед виступом<\u002Fdiv>\n      <h3 data-r=\"80\" style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(30px, 3.6vw, 44px); font-weight: 500; line-height: 1.12; letter-spacing: -0.01em; text-wrap: balance;\">Сім запитань до себе за день до виступу<\u002Fh3>\n      <div data-r=\"160\" style=\"display: flex; align-items: center; gap: 20px;\">\n        <svg width=\"96\" height=\"96\" sc-camel-view-box=\"0 0 96 96\" style=\"flex-shrink: 0; transform: rotate(-90deg);\">\n          <circle cx=\"48\" cy=\"48\" r=\"40\" fill=\"none\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"8\"><\u002Fcircle>\n          <circle cx=\"48\" cy=\"48\" r=\"40\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-dasharray=\"251.33\" stroke-dashoffset=\"{{ ringOffset }}\" style=\"transition: stroke-dashoffset 600ms cubic-bezier(0.4,0,0.2,1);\"><\u002Fcircle>\n        <\u002Fsvg>\n        <div style=\"display: flex; flex-direction: column; gap: 4px;\"><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 36px; font-weight: 500; line-height: 1;\">{{ doneCount }} / {{ totalCount }}<\u002Fspan><span style=\"font-size: 15px; color: rgba(255,255,255,0.8);\">{{ ringCaption }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex: 2 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 10px;\">\n      <sc-for list=\"{{ checks }}\" as=\"c\" hint-placeholder-count=\"7\">\n        <button data-r=\"{{ c.delay }}\" sc-camel-on-click=\"{{ c.toggle }}\" style-active=\"transform: scale(0.98);\" style=\"display: grid; grid-template-columns: 32px 1fr; gap: 16px; align-items: center; text-align: left; padding: 18px 22px; border: none; border-radius: 24px; background: {{ c.bg }}; color: #FFFFFF; font-family: Roboto, sans-serif; font-size: 17px; line-height: 1.5; cursor: pointer; transition: background 200ms cubic-bezier(0.4,0,0.2,1), transform 200ms cubic-bezier(0.4,0,0.2,1);\">\n          <span style=\"width: 32px; height: 32px; border-radius: 50px; background: {{ c.dotBg }}; color: #243776; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; transition: background 200ms cubic-bezier(0.4,0,0.2,1);\">{{ c.mark }}<\u002Fspan>\n          <span>{{ c.text }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FINALE -->\n<section data-screen-label=\"17 Фінал\" style=\"padding: clamp(96px, 12vw, 160px) 24px; background: linear-gradient(180deg, #FFFFFF 0%, #F4F6FA 100%);\">\n  <div style=\"max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px;\">\n    <blockquote data-r=\"0\" style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(34px, 5.6vw, 68px); line-height: 1.1; font-weight: 500; color: #1d2c5e; letter-spacing: -0.02em; text-wrap: balance;\">Люди запам'ятовують не те, що ви сказали, а те, що вони відчули поруч із вами.<\u002Fblockquote>\n    <p data-r=\"120\" style=\"margin: 0; font-size: 19px; line-height: 1.6; max-width: 680px; text-wrap: pretty;\">Аудиторія пробачить неідеальний голос, трохи тремтячі руки, навіть збій у техніці. Вона не пробачить байдужості. Якщо вам самим не цікаво те, про що ви говорите, нікому в залі не стане цікаво теж.<\u002Fp>\n    <div data-r=\"200\" style=\"padding: clamp(28px, 4vw, 44px); border-radius: 32px; background: #243776; color: #FFFFFF; display: flex; flex-direction: column; gap: 24px; box-shadow: 0 16px 48px rgba(36,55,118,0.14);\">\n      <div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,0.72);\">Ваш перший крок – уже сьогодні<\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 6px;\"><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 32px; font-weight: 500;\">01<\u002Fspan><span style=\"font-size: 16px; line-height: 1.5;\">Запишіть головну думку одним реченням.<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 6px;\"><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 32px; font-weight: 500;\">02<\u002Fspan><span style=\"font-size: 16px; line-height: 1.5;\">Знайдіть історію, яка її доводить.<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 6px;\"><span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 32px; font-weight: 500;\">03<\u002Fspan><span style=\"font-size: 16px; line-height: 1.5;\">Перепишіть заголовки слайдів на висновки.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"padding: 48px 24px 64px; background: #F4F6FA;\">\n  <div style=\"max-width: 960px; margin: 0 auto; font-size: 15px; line-height: 1.6; color: rgba(29,44,94,0.8);\">\n    <b style=\"color: #1d2c5e;\">Автори ідей, на які спирається матеріал:<\u002Fb> Ч. Гіт, Д. Гіт, Н. Дуарте, Г. Рейнольдс, К. Галло, Дж. Медина.\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showFacts&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Читання&quot;}}\">\nclass Component extends DCLogic {\n  state = { p: 0, disc: '', part: '', nav: false, wide: true, good: false, done: {} };\n  items = [\n    'Головну думку можна сказати одним реченням.',\n    'На кожному слайді одна ідея й заголовок-висновок.',\n    'Слайд читається за три секунди.',\n    'Не більше трьох кольорів і двох шрифтів.',\n    'З останнього ряду видно кожне слово.',\n    'Початок і кінець виступу звучать упевнено.',\n    'Є запасний варіант на випадок збою техніки: роздруківка або PDF.'\n  ];\n  ease = 'cubic-bezier(0.4,0,0.2,1)';\n\n  componentDidMount() {\n    this.reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;\n    this.io = new IntersectionObserver(es => es.forEach(e => {\n      if (!e.isIntersecting) return;\n      this.io.unobserve(e.target);\n      this.play(e.target);\n    }), { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });\n    this.onScroll = () => {\n      const h = document.documentElement, vh = innerHeight;\n      const max = h.scrollHeight - h.clientHeight;\n      let disc = '', part = '';\n      document.querySelectorAll('[data-disc]').forEach(el => { if (el.getBoundingClientRect().top < vh * 0.45) disc = el.dataset.disc; });\n      document.querySelectorAll('[data-part]').forEach(el => { if (el.getBoundingClientRect().top < vh * 0.45) part = el.dataset.part; });\n      const p = max > 0 ? Math.min(1, h.scrollTop / max) : 0;\n      const nav = h.scrollTop > vh * 0.7;\n      if (this.armed) document.querySelectorAll('[data-armed]').forEach(el => { const r = el.getBoundingClientRect(); if (r.top < vh * 0.92 && r.bottom > 0) this.play(el); });\n      const s = this.state;\n      if (Math.abs(s.p - p) > 0.002 || s.disc !== disc || s.part !== part || s.nav !== nav) this.setState({ p, disc, part, nav });\n    };\n    this.onResize = () => { const wide = innerWidth >= 900; if (wide !== this.state.wide) this.setState({ wide }); };\n    addEventListener('scroll', this.onScroll, { passive: true });\n    addEventListener('resize', this.onResize);\n    this.onResize(); this.onScroll();\n    this.armed = new WeakSet();\n    // recover elements hidden by a previous instance\n    document.querySelectorAll('[data-armed]').forEach(el => { this.armed.add(el); this.io.observe(el); });\n    this.arm();\n    setTimeout(() => this.arm(), 400);\n    this.fallback = setTimeout(() => {\n      document.querySelectorAll('[data-armed]').forEach(el => { if (el.getBoundingClientRect().top < innerHeight) this.play(el); });\n    }, 1200);\n  }\n  componentDidUpdate() { this.arm(); }\n  componentWillUnmount() {\n    removeEventListener('scroll', this.onScroll); removeEventListener('resize', this.onResize);\n    clearTimeout(this.fallback);\n    this.io && this.io.disconnect();\n  }\n\n  arm() {\n    if (!this.io || !this.armed) return;\n    const T = this.ease;\n    document.querySelectorAll('[data-r], [data-bar], [data-grow], [data-count]').forEach(el => {\n      if (this.armed.has(el) || el.hasAttribute('data-played')) return;\n      this.armed.add(el);\n      if (this.reduce) return;\n      el.setAttribute('data-armed', '1');\n      if (el.hasAttribute('data-r')) {\n        const d = parseInt(el.getAttribute('data-r'), 10) || 0;\n        el.style.opacity = '0';\n        el.style.transform = 'translateY(28px)';\n        el.style.transition = `opacity 800ms ${T} ${d}ms, transform 800ms ${T} ${d}ms` + (el.style.transition ? ', ' + el.style.transition : '');\n        this.io.observe(el);\n      } else if (el.hasAttribute('data-bar')) {\n        el.style.width = '0%';\n        el.style.transition = `width 1400ms ${T} 200ms`;\n        this.io.observe(el);\n      } else if (el.hasAttribute('data-grow')) {\n        const i = parseInt(el.getAttribute('data-grow'), 10) || 0;\n        el.style.transform = 'scaleY(0)';\n        el.style.transition = `transform 700ms ${T} ${i * 40}ms`;\n        this.io.observe(el);\n      } else if (el.hasAttribute('data-count')) {\n        this.io.observe(el);\n      }\n    });\n  }\n\n  play(el) {\n    if (!el.hasAttribute('data-armed')) return;\n    el.removeAttribute('data-armed');\n    el.setAttribute('data-played', '1');\n    if (this.io) this.io.unobserve(el);\n    if (el.hasAttribute('data-r')) {\n      el.style.opacity = '1';\n      el.style.transform = 'none';\n      const d = parseInt(el.getAttribute('data-r'), 10) || 0;\n      setTimeout(() => { el.style.transition = el.style.transition.split(', ').filter(t => !/^(opacity|transform) 800ms/.test(t)).join(', '); el.style.removeProperty('transform'); }, 900 + d);\n    } else if (el.hasAttribute('data-bar')) {\n      el.style.width = el.getAttribute('data-bar');\n    } else if (el.hasAttribute('data-grow')) {\n      el.style.transform = 'scaleY(1)';\n    } else if (el.hasAttribute('data-count')) {\n      const to = parseFloat(el.getAttribute('data-count'));\n      const dec = parseInt(el.getAttribute('data-dec') || '0', 10);\n      const node = el.firstChild; if (!node) return;\n      const t0 = performance.now(), dur = 1400, fin = to.toFixed(dec).replace('.', ',');\n      const tick = setInterval(() => {\n        const k = Math.min(1, (performance.now() - t0) / dur), v = to * (1 - Math.pow(1 - k, 3));\n        node.nodeValue = k < 1 ? v.toFixed(dec).replace('.', ',') : fin;\n        if (k >= 1) clearInterval(tick);\n      }, 30);\n      setTimeout(() => { clearInterval(tick); node.nodeValue = fin; }, dur + 100);\n    }\n  }\n\n  renderVals() {\n    const s = this.state, done = s.done;\n    const doneCount = Object.values(done).filter(Boolean).length;\n    const total = this.items.length;\n    const checks = this.items.map((text, i) => ({\n      text, delay: String(i * 70),\n      mark: done[i] ? '✓' : '',\n      bg: done[i] ? 'rgba(255,255,255,0.16)' : 'rgba(255,255,255,0.06)',\n      dotBg: done[i] ? '#FFFFFF' : 'rgba(255,255,255,0.14)',\n      toggle: () => this.setState(st => ({ done: { ...st.done, [i]: !st.done[i] } }))\n    }));\n    const attentionBars = Array.from({ length: 30 }, (_, m) => {\n      const t = m % 10, v = 1 - t * 0.065;\n      return { i: String(m), h: Math.round(v * 100) + '%', c: t === 0 && m > 0 ? '#FFFFFF' : 'rgba(255,255,255,' + (0.2 + v * 0.35).toFixed(2) + ')' };\n    });\n    const g = s.good;\n    return {\n      showFacts: this.props.showFacts ?? true,\n      progressPct: (s.p * 100).toFixed(1) + '%',\n      navOpacity: s.nav ? 1 : 0,\n      navY: s.nav ? '0' : '-12px',\n      navPointer: s.nav ? 'auto' : 'none',\n      partLabel: s.part || 'Виступ і презентація',\n      discLabel: s.disc ? 'Відкриття ' + s.disc + ' / 12' : 'Вступ',\n      stickyPos: s.wide ? 'sticky' : 'static',\n      attentionBars,\n      showBad: () => this.setState({ good: false }),\n      showGood: () => this.setState({ good: true }),\n      badBtnBg: g ? 'transparent' : '#243776', badBtnFg: g ? '#243776' : '#FFFFFF',\n      goodBtnBg: g ? '#243776' : 'transparent', goodBtnFg: g ? '#FFFFFF' : '#243776',\n      badOpacity: g ? 0 : 1, badScale: g ? 0.96 : 1,\n      goodOpacity: g ? 1 : 0, goodScale: g ? 1 : 1.04,\n      slideCaption: g ? 'Так: одна цифра, одна думка.' : 'Не так: слайд-конспект, який читають замість вас. Натисніть «Так».',\n      checks, doneCount, totalCount: total,\n      ringOffset: (251.33 * (1 - doneCount / total)).toFixed(2),\n      ringCaption: doneCount === total ? 'Можна виходити на сцену' : 'позначте, що вже готово'\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
